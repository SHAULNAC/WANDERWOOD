<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="2;url=https://wonderwoodprops.github.io/WanderWood/" />
  <title>WanderWood | מעבירים אותך לאתר החדש</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f2eb;
      --text: #2f241c;
      --accent: #b78858;
      --card: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #fffaf4 0%, var(--bg) 55%, #efe3d4 100%);
      font-family: "Assistant", "Segoe UI", Arial, sans-serif;
      color: var(--text);
      padding: 24px;
    }
    .card {
      width: min(680px, 100%);
      background: var(--card);
      border: 1px solid #eadac8;
      border-radius: 22px;
      padding: 34px;
      text-align: center;
      box-shadow: 0 18px 40px rgba(71, 48, 28, 0.12);
    }
    .logo { width: 68px; height: 68px; object-fit: contain; margin-bottom: 14px; }
    h1 { margin: 0 0 12px; font-size: clamp(1.7rem, 4vw, 2.5rem); }
    p { margin: 0 0 18px; line-height: 1.7; color: #5a4b3f; }
    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 16px;
      border-radius: 50%;
      border: 4px solid #ead8c2;
      border-top-color: var(--accent);
      animation: spin 0.9s linear infinite;
    }
    .cta {
      display: inline-block;
      text-decoration: none;
      background: var(--accent);
      color: #fff;
      padding: 11px 22px;
      border-radius: 12px;
      font-weight: 700;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    const targetUrl = "https://wonderwoodprops.github.io/WanderWood/";
    setTimeout(() => {
      window.location.replace(targetUrl);
    }, 2000);
  </script>
</head>
<body>
  <main class="card" role="main">
    <img src="favicon.png" alt="WanderWood" class="logo" />
    <div class="spinner" aria-hidden="true"></div>
    <h1>מעבירים אותך לאתר החדש של WanderWood</h1>
    <p>
      האתר עבר לכתובת חדשה. בעוד רגע תועברו אוטומטית.<br />
      אם ההעברה לא בוצעה, לחצו על הכפתור למטה.
    </p>
    <a class="cta" href="https://wonderwoodprops.github.io/WanderWood/">מעבר מיידי לאתר החדש</a>
  </main>
</body>
</html>
